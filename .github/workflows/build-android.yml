name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-vpn-${{ hashFiles('artifacts/vpn-app/package.ci.json') }}
          restore-keys: ${{ runner.os }}-npm-vpn-

      - name: Install dependencies (CI package)
        working-directory: artifacts/vpn-app
        run: |
          cp package.ci.json package.json
          npm install --legacy-peer-deps

      - name: Run TypeScript check
        working-directory: artifacts/vpn-app
        run: npx tsc -p tsconfig.json --noEmit

  build:
    name: Build Android APK (Native Gradle)
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-vpn-${{ hashFiles('artifacts/vpn-app/package.ci.json') }}
          restore-keys: ${{ runner.os }}-npm-vpn-

      - name: Install dependencies (CI package)
        working-directory: artifacts/vpn-app
        run: |
          cp package.ci.json package.json
          npm install --legacy-peer-deps

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate native Android project (expo prebuild)
        working-directory: artifacts/vpn-app
        run: npx expo prebuild --platform android --non-interactive --no-install --clean
        env:
          EXPO_NO_TELEMETRY: 1

      - name: Make gradlew executable
        working-directory: artifacts/vpn-app/android
        run: chmod +x ./gradlew

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('artifacts/vpn-app/android/**/*.gradle*', 'artifacts/vpn-app/android/**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Build debug APK
        working-directory: artifacts/vpn-app/android
        shell: bash
        run: |
          set -o pipefail
          echo "Dossier : $(pwd)"
          echo "Version Java :"
          java -version
          echo "Fichiers Android présents :"
          ls -la
          ./gradlew assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee ../../gradle-build-full.log

      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-diagnostics
          if-no-files-found: warn
          path: |
            gradle-build-full.log
            artifacts/vpn-app/android/app/build/reports/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SecureVPN-Pro-debug-apk
          path: artifacts/vpn-app/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/vpn-app/android/app/build/outputs/apk/debug/app-debug.apk
