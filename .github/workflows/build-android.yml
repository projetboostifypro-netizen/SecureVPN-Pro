name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-vpn-${{ hashFiles('artifacts/vpn-app/package.ci.json') }}
          restore-keys: ${{ runner.os }}-npm-vpn-

      - name: Install dependencies (CI package)
        working-directory: artifacts/vpn-app
        run: |
          cp package.ci.json package.json
          npm install --legacy-peer-deps

      - name: Run TypeScript check
        working-directory: artifacts/vpn-app
        run: npx tsc -p tsconfig.json --noEmit

  build:
    name: Build Android APK (EAS Cloud)
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-vpn-${{ hashFiles('artifacts/vpn-app/package.ci.json') }}
          restore-keys: ${{ runner.os }}-npm-vpn-

      - name: Install dependencies (CI package)
        working-directory: artifacts/vpn-app
        run: |
          cp package.ci.json package.json
          npm install --legacy-peer-deps

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK via EAS Cloud
        working-directory: artifacts/vpn-app
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
