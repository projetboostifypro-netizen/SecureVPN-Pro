name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  typecheck:
    name: TypeScript Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('artifacts/vpn-app/package.json') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install VPN app dependencies only
        working-directory: artifacts/vpn-app
        run: |
          # Standalone install without workspace resolution
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            // Remove workspace:* deps that don't exist standalone
            const deps = pkg.devDependencies || {};
            for (const [k, v] of Object.entries(deps)) {
              if (String(v).startsWith('workspace:') || String(v) === 'catalog:') {
                delete deps[k];
              }
            }
            pkg.devDependencies = deps;
            fs.writeFileSync('package.json.ci', JSON.stringify(pkg, null, 2));
          "
          mv package.json package.json.original
          mv package.json.ci package.json
          npm install --legacy-peer-deps
          mv package.json.original package.json

      - name: Run typecheck
        working-directory: artifacts/vpn-app
        run: npx tsc -p tsconfig.json --noEmit

  build:
    name: Build Android APK (EAS Cloud)
    runs-on: ubuntu-latest
    needs: typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.pnpm-store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('artifacts/vpn-app/package.json') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install VPN app dependencies
        working-directory: artifacts/vpn-app
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const deps = pkg.devDependencies || {};
            for (const [k, v] of Object.entries(deps)) {
              if (String(v).startsWith('workspace:') || String(v) === 'catalog:') {
                delete deps[k];
              }
            }
            pkg.devDependencies = deps;
            fs.writeFileSync('package.json.ci', JSON.stringify(pkg, null, 2));
          "
          mv package.json package.json.original
          mv package.json.ci package.json
          npm install --legacy-peer-deps
          mv package.json.original package.json

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android APK via EAS Cloud
        working-directory: artifacts/vpn-app
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
